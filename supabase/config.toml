# Minimal config for `supabase link` / `supabase db push` / `supabase functions deploy`.
project_id = "agentsphere"

[auth]
enable_anonymous_sign_ins = true

# The gateway's JWT check doesn't understand the new publishable/secret keys;
# both functions verify the caller's session themselves (caller() in _shared/common.ts).
[functions.chat]
verify_jwt = false

[functions.tts]
verify_jwt = false

[functions.stt]
verify_jwt = false

# Payments. shop is paid for with x402 (no sign-in) and world/callback is World's redirect;
# merchant and pay check the session themselves like chat.
[functions.shop]
verify_jwt = false

[functions.pay]
verify_jwt = false

[functions.merchant]
verify_jwt = false

[functions.world]
verify_jwt = false
