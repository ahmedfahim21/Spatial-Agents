name: AgentsphereMobile
options:
  bundleIdPrefix: com.abhisheksatpathy
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: LJM92X7XVW
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Agentsphere:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../Sources/Agentsphere/Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agentsphere
        UILaunchScreen: {}
        UIBackgroundModes: [audio, location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Agentsphere listens when you face an agent so you can talk to it hands-free.
        NSSpeechRecognitionUsageDescription: Your words are transcribed on-device and sent to the agent you're talking to.
        NSMotionUsageDescription: AirPods head tracking lets you face an agent to select it and nod or shake to answer.
        NSLocationWhenInUseUsageDescription: Agentsphere uses your location to find agents placed nearby and to place your own.
        NSLocationAlwaysAndWhenInUseUsageDescription: Agentsphere can tell you when an agent is nearby.
        NSCalendarsFullAccessUsageDescription: Your agents can tell you what's on your calendar and add events when you ask.
        NSRemindersFullAccessUsageDescription: Your agents can read your to-dos and add or tick off reminders when you ask.
        NSHealthShareUsageDescription: Your agents can tell you about your steps, sleep, workouts and heart rate when you ask. Health data stays on your iPhone except for the answer to your question.
        NSHealthUpdateUsageDescription: Agentsphere doesn't write to Apple Health.
        NSAlarmKitUsageDescription: Your agents can set alarms and timers when you ask.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhisheksatpathy.agentsphere
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Agentsphere:
    build:
      targets:
        Agentsphere: all
    run:
      config: Debug
      # Run without the debugger so nothing pauses the app on the phone.
      debugEnabled: false
    archive:
      config: Release
