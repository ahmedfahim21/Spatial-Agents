name: AgentsphereMobile
options:
  bundleIdPrefix: com.abhisheksatpathy
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: LJM92X7XVW
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Agentsphere:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../Sources/Agentsphere/Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agentsphere
        UILaunchScreen: {}
        UIBackgroundModes: [audio, location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Agentsphere listens when you face an agent so you can talk to it hands-free.
        NSSpeechRecognitionUsageDescription: Your words are transcribed on-device and sent to the agent you're talking to.
        NSMotionUsageDescription: AirPods head tracking lets you face an agent to select it and nod or shake to answer.
        NSLocationWhenInUseUsageDescription: Agentsphere uses your location to find agents placed nearby and to place your own.
        NSLocationAlwaysAndWhenInUseUsageDescription: Agentsphere can tell you when an agent is nearby.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhisheksatpathy.agentsphere
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
